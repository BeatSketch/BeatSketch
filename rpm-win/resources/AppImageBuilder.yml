version: 1
script:
  # Remove any previous build
  - rm -rf AppDir  | true
  # Make usr and icons dirs
  - mkdir -p AppDir/usr/bin/beatsketch
  # Copy the python application code into the AppDir
  - cp -r launcher/dist/beatsketch/ AppDir/usr/bin
  # Install application dependencies
  - python3 -m pip install --system --ignore-installed --prefix=/usr
    --root=AppDir -r ./requirements.txt

AppDir:
  path: ./AppDir

  app_info:
    id: io.github.beatsketch.launcher
    name: BeatSkech
    icon: utilities-terminal
    version: 0.1.0
    # Set the python executable as entry point
    exec: usr/bin/beatsketch/BeatSketchLauncher
    # Set the application main script path as argument. Use '$@' to forward CLI parameters
    exec_args: "$@"

AppImage:
  update-information: 'guess'
  sign-key: None
  arch: x86_64
